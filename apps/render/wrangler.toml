name = "render-box-render"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[dev]
port = 8788
inspector_port = 9231

# Placeholders: `pnpm setup:remote` writes the real values to render-box.deploy.json
# and deploys with a generated wrangler.deploy.toml. Local values live in .dev.vars.
[vars]
APP_ORIGIN = "https://render-box-admin.example.workers.dev"
RENDER_ORIGIN = "https://render-box-render.example.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "render-box"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../packages/db/migrations"
