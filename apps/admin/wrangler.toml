name = "render-box-admin"
main = "src/index.tsx"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"

[dev]
port = 8787
inspector_port = 9230

# Production values. Local overrides live in .dev.vars (see .dev.vars.example).
[vars]
APP_ORIGIN = "https://render-box-admin.leets1490.workers.dev"
RENDER_ORIGIN = "https://render-box-render.leets1490.workers.dev"
# Total HTML storage cap and warning threshold (design.md 4.9).
STORAGE_LIMIT_MB = "400"
STORAGE_WARN_PERCENT = "80"

[[d1_databases]]
binding = "DB"
database_name = "render-box"
database_id = "7a6ff898-fd18-4613-bc56-eb6b7bc76b70"
migrations_dir = "../../packages/db/migrations"
