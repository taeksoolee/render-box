name = "render-box-admin"
main = "src/index.tsx"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"

[dev]
port = 8787
inspector_port = 9230

# Placeholders: `pnpm setup:remote` writes the real values to render-box.deploy.json
# and deploys with a generated wrangler.deploy.toml. Local values live in .dev.vars.
[vars]
APP_ORIGIN = "https://render-box-admin.example.workers.dev"
RENDER_ORIGIN = "https://render-box-render.example.workers.dev"
# Total HTML storage cap and warning threshold (design.md 4.9).
STORAGE_LIMIT_MB = "400"
STORAGE_WARN_PERCENT = "80"
# Admin "도움말" link; empty hides it.
HELP_URL = "https://github.com/taeksoolee/render-box/blob/main/docs/guide.md"

[[d1_databases]]
binding = "DB"
database_name = "render-box"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../packages/db/migrations"
