name = "render-box-mcp"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[dev]
port = 8789
inspector_port = 9232

# Production values. Local overrides live in .dev.vars (see .dev.vars.example).
[vars]
APP_ORIGIN = "https://render-box-admin.example.workers.dev"
RENDER_ORIGIN = "https://render-box-render.example.workers.dev"
MCP_ORIGIN = "https://render-box-mcp.example.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "render-box"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../packages/db/migrations"
