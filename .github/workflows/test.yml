name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Unit tests, including the versions/storage SQL on node:sqlite. The
      # Playwright suite needs the three Workers running and stays local.
      - run: pnpm test
      # Admin and render with DEV_MODE off: the code paths only production
      # takes (asset manifest, HSTS, https-only render CSP). Local workerd, no
      # Cloudflare account.
      - run: pnpm check:prod-mode
